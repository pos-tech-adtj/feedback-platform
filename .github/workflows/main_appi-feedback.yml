
name: CI/CD - Azure Function App | appi-feedback

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: appi-feedback
  PACKAGE_DIRECTORY: .
  JAVA_VERSION: '21'

jobs:
  # ==========================================
  # 1. TESTS
  # ==========================================
  tests:
    name: '1. Tests'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: mvn -B clean test

  # ==========================================
  # 2. BUILD
  # ==========================================
  build:
    name: '2. Build'
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build Azure Function package
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: mvn -B clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-function-package
          path: target/azure-functions/${{ env.AZURE_FUNCTIONAPP_NAME }}/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # 3. DEPLOY
  # ==========================================
  deploy:
    name: '3. Deploy'
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: azure-function-package
          path: ./deploy-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7EF8C8DD73B448ADA8F65B517A425E0B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CD12C967EFBE4F97975A678566087796 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2D5F57A0E0C1486E82021F8CCF4CC173 }}

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: Production
          package: ./deploy-package
